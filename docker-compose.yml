services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    environment:
      MONGO_URI: "mongodb://mongo:27017/dev"
      MONGO_DB_NAME: "dev"
      UPLOADS_DIR: "/app/static/uploads"
      FERNET_KEY_PATH: "/app/data/fernet.key"
    volumes:
      - app_data:/app/data
      - app_uploads:/app/static/uploads

volumes:
  mongo_data:
  app_data:
  app_uploads:
